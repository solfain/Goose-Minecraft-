name: Build XRTCF Chess Debug APK

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xrtcf-chess

    env:
      STOCKFISH_TAG: sf_19

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: xrtcf-chess/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make scripts executable
        run: chmod +x gradlew scripts/fetch-stockfish.sh

      - name: Fetch Stockfish (Android arm64 for APK assets)
        run: ./scripts/fetch-stockfish.sh arm64-v8a

      - name: Fetch Stockfish (Linux x86-64 for unit tests)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/sf.tgz \
            "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_TAG}/stockfish-linux-x86-64-universal.tar.gz"
          mkdir -p /tmp/sf
          tar -xzf /tmp/sf.tgz -C /tmp/sf
          BIN="$(find /tmp/sf -type f -name 'stockfish*' | head -1)"
          chmod +x "$BIN"
          echo "STOCKFISH_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" <<< 'uci' | head -3

      - name: Run tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon test 2>&1 | tee /tmp/gradle-test.log
          echo '### Gradle test tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/gradle-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate test failure
        if: failure()
        run: |
          # Emit the interesting Gradle lines as a GitHub annotation (readable via API)
          if [ -f /tmp/gradle-test.log ]; then
            # Prefer compiler/test failure context
            BODY=$(grep -E 'e: |FAILED|error:|Test.*failed|What went wrong|> Task .*FAILED|Caused by:' /tmp/gradle-test.log | head -80 | tr '\n' ' | ')
            if [ -z "$BODY" ]; then
              BODY=$(tail -n 80 /tmp/gradle-test.log | tr '\n' ' | ')
            fi
            # Annotations cap ~64KB; keep it bounded
            BODY=$(printf '%s' "$BODY" | head -c 6000)
            echo "::error title=Gradle test failed::${BODY}"
          else
            echo "::error title=Gradle test failed::/tmp/gradle-test.log missing"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/gradle-assemble.log
          echo '### Gradle assemble tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/gradle-assemble.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xrtcf-chess-debug-apk
          path: xrtcf-chess/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: /tmp/gradle-*.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            xrtcf-chess/**/build/reports/tests/
            xrtcf-chess/**/build/test-results/
          if-no-files-found: ignore
